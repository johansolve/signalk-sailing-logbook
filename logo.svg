<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Sailing Logbook">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a8199"/>
      <stop offset="1" stop-color="#154f62"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- mast -->
  <rect x="252" y="104" width="8" height="238" rx="4" fill="#ffffff" opacity="0.9"/>

  <!-- mainsail (aft) -->
  <path d="M244 116 L244 334 L150 334 Z" fill="#ffffff"/>
  <!-- jib (fore) -->
  <path d="M268 146 L268 334 L360 334 Z" fill="#dbeef3"/>

  <!-- hull -->
  <path d="M104 344 L408 344 C392 404 320 410 256 410 C192 410 120 404 104 344 Z" fill="#ffffff"/>

  <!-- water -->
  <path d="M120 446 C168 432 216 432 256 446" fill="none" stroke="url(#water)" stroke-width="12" stroke-linecap="round"/>
  <path d="M270 446 C310 432 358 432 396 446" fill="none" stroke="url(#water)" stroke-width="12" stroke-linecap="round"/>
</svg>
